<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kedai Mococo - Pesanan Online</title>
    
    <!-- Framework & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- File CSS Kamu -->
    <link rel="stylesheet" href="style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        custom: '#541161',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50">

<div class="main-wrapper max-w-md mx-auto bg-white min-h-screen shadow-2xl">
    <!-- PAGE BERANDA -->
    <div id="page-beranda" class="page active">
        <header class="bg-custom text-white p-6 rounded-b-[40px] shadow-lg sticky top-0 z-50">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img src="logo.png" alt="Logo" class="h-14 w-14 object-cover rounded-full bg-white p-1 shadow-md">
                    <div>
                        <h1 class="text-2xl font-bold text-violet-100">Kedai Mococo</h1>
                        <p class="text-[10px] opacity-80 uppercase italic mt-1">Mood Booster dalam Setiap Sedotan</p>
                    </div>
                </div>
                <div class="bg-white/10 p-3 rounded-2xl"><i class="fas fa-shopping-bag text-xl"></i></div>
            </div>
        </header>

        <!-- Promo Section -->
        <div class="mt-6 px-4">
            <h2 class="text-lg font-bold mb-3 text-slate-800 flex items-center">
                <i class="fas fa-bolt mr-2 text-yellow-500"></i> Promo Hemat
            </h2>
            <div class="flex overflow-x-auto space-x-4 pb-4 scrollbar-hide">
                <div class="min-w-[280px] bg-gradient-to-br from-[#541161] to-[#8a238a] rounded-3xl p-5 text-white shadow-xl flex flex-col justify-between">
                    <div>
                        <span class="bg-white/20 text-[10px] px-2 py-1 rounded-full uppercase font-bold tracking-widest">Paling Laris</span>
                        <h3 class="text-lg font-bold mt-2 italic">COMBO NYEMIL</h3>
                        <p class="text-xs opacity-80">Rice Bowl + Es Boba Segar</p>
                    </div>
                    <div class="mt-4 flex justify-between items-end">
                        <span class="text-xl font-black">Rp 35.000</span>
                        <button onclick="bukaHalaman('pembayaran')" class="bg-white text-custom px-4 py-1.5 rounded-xl text-xs font-bold shadow-sm active:scale-95 transition-all">Beli Sekarang</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter Tab -->
        <div class="mt-4 px-4">
            <div class="flex space-x-2 overflow-x-auto scrollbar-hide py-2">
                <button onclick="renderMenu('semua')" class="category-tab active px-5 py-2 rounded-full border border-slate-200 text-xs font-bold whitespace-nowrap bg-white">Semua</button>
                <button onclick="renderMenu('makanan')" class="category-tab px-5 py-2 rounded-full border border-slate-200 text-xs font-bold whitespace-nowrap bg-white">Makanan</button>
                <button onclick="renderMenu('minuman')" class="category-tab px-5 py-2 rounded-full border border-slate-200 text-xs font-bold whitespace-nowrap bg-white">Minuman</button>
                <button onclick="renderMenu('jajanan')" class="category-tab px-5 py-2 rounded-full border border-slate-200 text-xs font-bold whitespace-nowrap bg-white">Jajanan</button>
            </div>
        </div>

        <!-- Menu Container -->
        <main class="p-4">
            <div id="menu-container" class="grid grid-cols-1 gap-4"></div>
            
            <!-- Testimoni -->
            <div class="flex justify-between items-center mt-8 mb-4">
                <h2 class="text-sm font-black text-slate-400 border-l-4 border-custom pl-3 uppercase tracking-[2px]">Testimoni</h2>
            </div>
            <div class="flex overflow-x-auto space-x-3 pb-4 scrollbar-hide">
                <div class="bg-white p-4 rounded-2xl min-w-[200px] shadow-sm border border-slate-100">
                    <p class="text-[10px] text-slate-600 italic">"Nasi bowlnya enak banget, kenyang!"</p>
                    <p class="text-[10px] font-bold mt-2 text-custom">Sarah</p>
                </div>
            </div>
        </main>

        <footer class="bg-custom p-6 text-white rounded-t-[40px] mt-10 text-center">
            <p class="text-[9px] opacity-30 tracking-[3px] uppercase">© by avrillia zeltha</p>
        </footer>
    </div>

    <!-- PAGE PEMBAYARAN -->
    <div id="page-pembayaran" class="page hidden">
        <header class="bg-white p-6 border-b border-slate-100 flex items-center sticky top-0 z-50">
            <button onclick="bukaHalaman('beranda')" class="w-10 h-10 bg-slate-100 text-custom rounded-full flex items-center justify-center mr-4">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="text-lg font-bold text-slate-800">Checkout</h1>
        </header>
        
        <main class="p-4 space-y-6 pb-40">
            <section class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="text-xs font-black text-custom mb-4 uppercase tracking-widest">Informasi Penerima</h3>
                <div class="space-y-3">
                    <input type="text" id="namaPenerima" placeholder="Nama Lengkap" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs outline-none">
                    <textarea id="alamatLengkap" placeholder="Alamat Pengiriman Lengkap" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs outline-none"></textarea>
                </div>
            </section>

            <div id="checkout-list" class="space-y-3"></div>

            <section class="bg-white p-6 rounded-[32px] shadow-sm space-y-3">
                <div class="flex justify-between text-lg">
                    <span class="font-bold italic">Total Bayar</span>
                    <span id="pay-total" class="font-black text-custom">Rp 0</span>
                </div>
            </section>
        </main>

        <div class="fixed bottom-0 left-0 right-0 p-5 bg-white border-t border-slate-100 shadow-2xl z-50">
            <button onclick="prosesPesanan()" class="w-full bg-custom text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg">Konfirmasi Pesanan via WA</button>
        </div>
    </div>

    <!-- FLOATING CART -->
    <div id="floating-cart" class="fixed bottom-0 left-0 right-0 p-5 bg-white/80 backdrop-blur-md shadow-2xl z-50 hidden">
        <button onclick="bukaHalaman('pembayaran')" class="w-full bg-custom text-white py-4 rounded-2xl font-bold flex justify-between px-6 shadow-xl">
            <span class="text-sm">Lihat Keranjang</span>
            <span id="footer-total" class="font-black text-lg">Rp 0</span>
        </button>
    </div>
</div>

<!-- Modal Topping -->
<div id="modal-topping" class="fixed inset-0 z-[100] hidden flex items-end justify-center">
    <div class="fixed inset-0 bg-black/40 backdrop-blur-sm" onclick="tutupModal()"></div>
    <div class="bg-white w-full max-w-md rounded-t-[40px] p-6 relative shadow-2xl animate-slide-up">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
        <div id="modal-content"></div>
    </div>
</div>

<style>
    .page { display: none; }
    .page.active { display: block; }
    @keyframes slide-up {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
    }
    .animate-slide-up { animation: slide-up 0.3s ease-out; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
</style>

<script src="script.js"></script>
</body>
</html>
